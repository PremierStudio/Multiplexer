[workspace]
resolver = "2"
members = [
    "crates/multiplexer-wire",
    "crates/multiplexer-provider",
    "crates/multiplexer-resman",
    "crates/multiplexer-worktree",
    "crates/multiplexer-mcp",
    "crates/multiplexer-layout",
    "crates/multiplexer-shell",
    "crates/multiplexer-server",
    "apps/multiplexer-desktop",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/PremierStudio/Multiplexer"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
cargo-mutants = { version = "1" }
win32job = "2"
multiplexer-wire = { path = "crates/multiplexer-wire" }