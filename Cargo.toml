[workspace]
resolver = "2"
members = [
    "crates/multiplexer-wire",
    "crates/multiplexer-provider",
    "crates/multiplexer-resman",
    "crates/multiplexer-worktree",
    "crates/multiplexer-checkpoint",
    "crates/multiplexer-mcp",
    "crates/multiplexer-layout",
    "crates/multiplexer-shell",
    "crates/multiplexer-terminal",
    "crates/multiplexer-auth",
    "crates/multiplexer-core",
    "crates/multiplexer-server",
    "apps/multiplexer-desktop",
    "apps/multiplexer-server",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/PremierStudio/Multiplexer"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
cargo-mutants = { version = "1" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
win32job = "2"
toml = "0.8"
sysinfo = "0.38"
multiplexer-wire = { path = "crates/multiplexer-wire" }