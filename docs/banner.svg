<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-label="Multiplexer: the control surface for your AI coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1226"/>
      <stop offset="100%" stop-color="#0a0f1f"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="420" fill="url(#bg)"/>
  <rect width="1400" height="420" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="105" x2="1400" y2="105"/>
    <line x1="0" y1="210" x2="1400" y2="210"/>
    <line x1="0" y1="315" x2="1400" y2="315"/>
    <line x1="350" y1="0" x2="350" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- multiplexer pane motif: three panes + a pop-out, the control-surface idea -->
  <g transform="translate(64, 60)">
    <!-- left sidebar (chat) -->
    <rect x="0" y="0" width="150" height="290" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="26" rx="12" fill="#1e293b"/>
    <circle cx="14" cy="13" r="4" fill="#22d3ee"/>
    <circle cx="30" cy="13" r="4" fill="#a78bfa"/>
    <circle cx="46" cy="13" r="4" fill="#f472b6"/>
    <rect x="14" y="44" width="30" height="7" rx="3.5" fill="#334155"/>
    <rect x="14" y="62" width="122" height="7" rx="3.5" fill="#263449"/>
    <rect x="14" y="84" width="102" height="7" rx="3.5" fill="#263449"/>
    <rect x="14" y="106" width="30" height="7" rx="3.5" fill="#334155"/>
    <rect x="14" y="124" width="118" height="36" rx="7" fill="#1e293b" stroke="#2b3a55" stroke-width="1"/>
    <circle cx="30" cy="142" r="8" fill="#0ea5e9"/>
    <rect x="46" y="133" width="74" height="6" rx="3" fill="#2b3a55"/>
    <rect x="46" y="145" width="58" height="6" rx="3" fill="#222f47"/>
    <rect x="14" y="180" width="30" height="7" rx="3.5" fill="#334155"/>
    <rect x="14" y="198" width="112" height="7" rx="3.5" fill="#263449"/>
    <rect x="14" y="220" width="96" height="7" rx="3.5" fill="#263449"/>
    <rect x="14" y="252" width="122" height="26" rx="13" fill="#0ea5e9"/>
    <text x="75" y="269" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#04121c" text-anchor="middle" font-weight="600">Send</text>
  </g>

  <!-- center build pane -->
  <g transform="translate(230, 60)">
    <rect x="0" y="0" width="300" height="290" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="26" rx="12" fill="#1e293b"/>
    <rect x="12" y="7" width="120" height="13" rx="6.5" fill="#334155"/>
    <rect x="12" y="44" width="276" height="120" rx="8" fill="#111c33" stroke="#1e293b" stroke-width="1"/>
    <g font-family="'Consolas', 'SF Mono', monospace" font-size="11" fill="#64748b">
      <text x="24" y="64">1</text><rect x="34" y="55" width="0" height="0"/>
      <text x="40" y="64" fill="#22d3ee">fn build(</text><text x="80" y="64" fill="#e2e8f0">session</text><text x="120" y="64" fill="#22d3ee">)</text><text x="130" y="64" fill="#64748b">{</text>
      <text x="24" y="82">2</text><text x="40" y="82" fill="#a78bfa">let</text><text x="66" y="82" fill="#e2e8f0"> diff</text><text x="84" y="82" fill="#f472b6">=</text><text x="96" y="82" fill="#e2e8f0"> apply</text><text x="122" y="82" fill="#f472b6">(</text><text x="130" y="82" fill="#34d399">patch</text><text x="156" y="82" fill="#f472b6">)</text><text x="164" y="82" fill="#64748b">;</text>
      <text x="24" y="100">3</text><text x="40" y="100" fill="#e2e8f0">   run_tests</text><text x="88" y="100" fill="#f472b6">(</text><text x="96" y="100" fill="#34d399">diff</text><text x="112" y="100" fill="#f472b6">)</text><text x="120" y="100" fill="#64748b">;</text>
    </g>
    <rect x="12" y="180" width="276" height="8" rx="4" fill="#1e293b"/>
    <rect x="12" y="180" width="186" height="8" rx="4" fill="#0ea5e9"/>
    <text x="24" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">12/15 tests · 98% coverage · 0 survivors</text>
    <rect x="12" y="232" width="82" height="20" rx="6" fill="#134e4a"/><text x="53" y="246" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#34d399" text-anchor="middle">RED</text>
    <rect x="102" y="232" width="82" height="20" rx="6" fill="#1e3a8a"/><text x="143" y="246" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#60a5fa" text-anchor="middle">GREEN</text>
    <rect x="192" y="232" width="96" height="20" rx="6" fill="#3b0764"/><text x="240" y="246" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#c084fc" text-anchor="middle">REFACTOR</text>
  </g>

  <!-- right instrumentation bar (HAR waterfall + browser) -->
  <g transform="translate(546, 60)">
    <rect x="0" y="0" width="150" height="290" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="26" rx="12" fill="#1e293b"/>
    <rect x="12" y="40" width="126" height="7" rx="3.5" fill="#263449"/>
    <g font-family="'Consolas', monospace" font-size="10" fill="#64748b">
      <text x="14" y="66">GET /api</text>
      <rect x="78" y="58" width="52" height="6" rx="3" fill="#0ea5e9"/>
      <text x="14" y="86">POST /auth</text>
      <rect x="78" y="78" width="34" height="6" rx="3" fill="#a78bfa"/>
      <text x="14" y="106">GET /db</text>
      <rect x="78" y="98" width="60" height="6" rx="3" fill="#f59e0b"/>
      <text x="14" y="126">SSE /stream</text>
      <rect x="78" y="118" width="66" height="6" rx="3" fill="#22d3ee"/>
    </g>
    <rect x="12" y="146" width="126" height="60" rx="8" fill="#111c33" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="166" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94a3b8">HAR waterfall</text>
    <text x="24" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#475569">4 req · 212ms · 1 blocking</text>
    <rect x="12" y="222" width="126" height="7" rx="3.5" fill="#263449"/>
    <rect x="12" y="240" width="126" height="7" rx="3.5" fill="#263449"/>
    <rect x="12" y="258" width="90" height="7" rx="3.5" fill="#222f47"/>
  </g>

  <!-- pop-out pane (the "every pane pops out" differentiator) + terminal below -->
  <g transform="translate(712, 168)">
    <rect x="0" y="0" width="120" height="86" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#1e293b"/>
    <circle cx="12" cy="10" r="3" fill="#ef4444"/>
    <circle cx="26" cy="10" r="3" fill="#f59e0b"/>
    <circle cx="40" cy="10" r="3" fill="#22c55e"/>
    <rect x="12" y="30" width="96" height="5" rx="2.5" fill="#334155"/>
    <rect x="12" y="42" width="80" height="5" rx="2.5" fill="#263449"/>
    <rect x="12" y="54" width="96" height="5" rx="2.5" fill="#263449"/>
    <rect x="12" y="66" width="60" height="5" rx="2.5" fill="#222f47"/>
  </g>
  <g transform="translate(712, 262)">
    <rect x="0" y="0" width="120" height="88" rx="10" fill="#0a0f1c" stroke="#1e293b" stroke-width="1.5"/>
    <g font-family="'Consolas', monospace" font-size="9" fill="#64748b">
      <text x="12" y="20" fill="#34d399">$ cargo test</text>
      <text x="12" y="36" fill="#94a3b8">running 42 tests</text>
      <text x="12" y="52" fill="#94a3b8">test result: ok.</text>
      <text x="12" y="68" fill="#60a5fa">42 passed · 0 failed</text>
    </g>
  </g>

  <!-- wordmark -->
  <text x="850" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="url(#word)" letter-spacing="-1.5">Multiplexer</text>

  <!-- tagline -->
  <text x="850" y="220" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#94a3b8" font-weight="400">The control surface for your AI coding agents</text>

  <!-- accent underline -->
  <rect x="850" y="240" width="470" height="4" rx="2" fill="url(#accent)"/>
</svg>