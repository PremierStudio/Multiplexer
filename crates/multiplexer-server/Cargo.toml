[package]
name = "multiplexer-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "JSON-RPC request router and WebSocket listen loop for the Multiplexer composition root."

[dependencies]
multiplexer-wire = { path = "../multiplexer-wire" }
multiplexer-provider = { path = "../multiplexer-provider" }
multiplexer-worktree = { path = "../multiplexer-worktree" }
multiplexer-core = { path = "../multiplexer-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true

[dev-dependencies]
multiplexer-resman = { path = "../multiplexer-resman" }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
