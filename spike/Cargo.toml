[package]
name = "multiplexer-phase0-spike"
version = "0.1.0"
edition = "2021"
description = "Phase-0 spike: prove xai-grok-shell is consumable as a library on Windows"

# Replicate the vendored grok-build workspace's [patch.crates-io] so the
# external crate resolves the same patched dependency versions (async-openai
# fork with the ReasoningEffort::Max variant, etc.).
[patch.crates-io]
async-openai = { git = "https://github.com/our-forks/async-openai.git", rev = "95b52ebdedf42143083cf3d6f0e0be7c84e9c808" }

[dependencies]
xai-grok-version = { path = "../third_party/grok-build/crates/codegen/xai-grok-version" }
xai-grok-shell = { path = "../third_party/grok-build/crates/codegen/xai-grok-shell" }
xai-grok-config = { path = "../third_party/grok-build/crates/codegen/xai-grok-config" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }